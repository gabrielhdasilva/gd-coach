// Preferencia de apariencia independiente de los datos de alumnos.
const THEME_KEY='gdcoach_theme';
const themeButton=document.getElementById('themeToggle');
function applyTheme(theme){
  const chosen=theme==='light'?'light':'dark';
  document.documentElement.dataset.theme=chosen;
  themeButton.textContent=chosen==='dark'?'☀️ Modo claro':'🌙 Modo oscuro';
  themeButton.setAttribute('aria-pressed',String(chosen==='light'));
  themeButton.title=chosen==='dark'?'Activar modo claro':'Activar modo oscuro';
}
let savedTheme='dark';
try{savedTheme=localStorage.getItem(THEME_KEY)||'dark'}catch(e){}
applyTheme(savedTheme);
themeButton.addEventListener('click',()=>{
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}

 el.innerHTML=`<section class="card"><h2>Constructor de rutinas</h2><p class="muted">Creá una planificación independiente para ${esc(student.name)}. Podés elegir de 1 a 7 días y de 1 a 12 semanas. Por seguridad, el plan anterior no se reemplaza sin confirmación.</p><div class="grid"><div><label>Nombre del programa</label><input id="newPlanName" value="${esc(student.planName||'Nueva planificación')}"></div><div><label>Días por semana</label><select id="newPlanDays">${Array.from({length:7},(_,i)=>`<option value="${i+1}" ${planDays(student)===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label>Semanas</label><select id="newPlanWeeks">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${planWeeks(student)===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div></div><p class="muted">El programa comienza vacío: después agregás los ejercicios desde la biblioteca en cada día.</p><div class="toolbar"><button id="saveNewPlan" type="button">Crear planificación vacía</button><button class="alt" id="cancelNewPlan" type="button">Cancelar</button></div><div id="builderFeedback" role="status" aria-live="polite" style="margin-top:12px"></div><div class="toolbar" id="builderConfirm" style="display:none;margin-top:12px"><button type="button" id="confirmNewPlan">Sí, crear planificación</button><button type="button" class="alt" id="backNewPlan">Volver</button></div></section>`;
 $('cancelNewPlan').onclick=()=>{view='plan';render()};
 $('saveNewPlan').onclick=()=>{
   const name=$('newPlanName').value.trim();if(!name){$('builderFeedback').textContent='Ingresá un nombre para el programa.';return}
   const n=Number($('newPlanDays').value),w=Number($('newPlanWeeks').value);
   if(!Number.isInteger(n)||n<1||n>7||!Number.isInteger(w)||w<1||w>12){$('builderFeedback').textContent='Elegí entre 1 y 7 días y entre 1 y 12 semanas.';return}
   $('builderFeedback').innerHTML='<div class="info">Se archivará la planificación actual de '+esc(student.name)+' y se creará <strong>'+esc(name)+'</strong> con '+n+' días y '+w+' semanas. Los registros anteriores quedarán en el respaldo JSON. Exportá un respaldo antes de continuar.</div>';
   $('builderConfirm').style.display='flex';
   $('saveNewPlan').disabled=true;
   $('backNewPlan').onclick=()=>{$('builderConfirm').style.display='none';$('builderFeedback').textContent='';$('saveNewPlan').disabled=false};
   $('confirmNewPlan').onclick=()=>{
     student.planArchive ||= [];
     student.planArchive.push({name:student.planName||'Plan anterior',plan:copy(student.plan),weeks:planWeeks(student),logs:copy(student.logs||{}),setLogs:copy(student.setLogs||{}),done:copy(student.done||{}),archivedAt:new Date().toISOString()});
     student.planName=name;student.planWeeks=w;student.plan=Array.from({length:n},()=>[]);student.logs={};student.setLogs={};student.done={};week=0;day=0;save();view='plan';render();
     const content=$('content');if(content){const success=document.createElement('div');success.className='info';success.setAttribute('role','status');success.style.marginTop='12px';success.textContent='✓ Planificación creada: '+name+'. Elegí «+ Agregar ejercicio» para empezar el Día 1.';content.prepend(success)}
   };
 };
}

function sessionStats(s){
 const exercises=s.plan?.[day]||[];let total=0,logged=0;
 exercises.forEach((e,i)=>{for(let j=0;j<Math.max(1,Math.min(6,Number(e.sets)||3));j++){
  total++;const v=s.setLogs?.[key(week,day,i)+':'+j]||{};
  if(v.kg!==undefined&&v.kg!==''&&v.reps!==undefined&&v.reps!=='')logged++;
 }});
 return {total,logged,pct:total?Math.round(100*logged/total):0};
}

function renderExercise(e,i,s,coach){let list=data.library.map(x=>x.name);if(!list.includes(e.name))list.unshift(e.name);let warning=e.reps==='REVISAR';return `<div class="ex"><div class="exhead"><h3>${i+1}. ${esc(e.name)}</h3>${coach?`<button class="alt small" data-remove="${i}">Quitar</button>`:''}</div>${coach?`<div class="formgrid"><div><label>Ejercicio</label>${menu(i+':name',list,e.name)}</div><div><label>Series efectivas</label>${menu(i+':sets',[1,2,3,4,5,6],Number(e.sets))}</div><div><label>Repeticiones / objetivo</label><input data-p="${i}:reps" list="reps-suggestions" value="${esc(e.reps)}" placeholder="Ej.: 8-12, 10/lado, 30 s" aria-label="Objetivo de repeticiones"><small class="muted">Editable: rango, repeticiones fijas, por lado, tiempo o AMRAP.</small></div><div><label>RIR</label>${menu(i+':rir',[0,1,2,3,4,5],e.rir)}</div><div><label>Descanso (seg)</label>${menu(i+':rest',[30,45,60,75,90,105,120,150,180,240],e.rest)}</div></div><label>Nota técnica (editable)</label><textarea rows="2" data-note="${i}">${esc(note(e))}</textarea><label>Video específico (opcional)</label><input data-video="${i}" value="${esc(e.video||'')}" placeholder="https://youtube.com/...">`:`<p class="muted">${esc(e.sets)} series efectivas · ${esc(e.reps)} reps · RIR ${esc(fmtRir(e.rir))} · ${esc(e.rest)} s descanso</p><p class="note">${esc(note(e))}</p>`}${warning?'<p class="info">⚠ Revisar repeticiones: el Excel original convirtió este rango en fecha.</p>':''}<p><a href="${esc(videoUrl(e))}" target="_blank" rel="noopener noreferrer">▶ Ver demostración</a> <span class="muted small">${e.video?'Video asignado':'Búsqueda de YouTube · referencia temporal'}</span></p><div class="series-record"><h4>Registro de la semana ${week+1}</h4><p class="muted small">Anotá el peso y las repeticiones reales de cada serie efectiva.</p><div class="set-row set-head"><span>Serie</span><span>Peso (kg)</span><span>Reps reales</span></div>${Array.from({length:Math.max(1,Math.min(6,Number(e.sets)||3))},(_,j)=>{const k=key(week,day,i)+':'+j;const v=s.setLogs?.[k]||{};return `<div class="set-row ${v.kg!==undefined&&v.kg!==''&&v.reps!==undefined&&v.reps!==''?'logged':''}"><span>${j+1}</span><input type="number" min="0" step="0.5" inputmode="decimal" aria-label="Peso serie ${j+1}" data-set-log="${k}" data-field="kg" value="${esc(v.kg??'')}" placeholder="kg"><input type="number" min="0" step="1" inputmode="numeric" aria-label="Repeticiones serie ${j+1}" data-set-log="${k}" data-field="reps" value="${esc(v.reps??'')}" placeholder="reps"></div>`}).join('')}${s.logs?.[key(week,day,i)]?`<p class="hint muted">Registro anterior: ${esc(s.logs[key(week,day,i)])}</p>`:''}</div></div>`}
function renderHistory(s){
 const c=$('content');
 const opts=(s.plan||[]).flatMap((arr,d)=>arr.map((e,i)=>({d,i,name:e.name})));
 const unique=opts.filter((x,i)=>opts.findIndex(y=>y.d===x.d&&y.i===x.i)===i);
 const selected=unique.find(x=>x.d===historyDay&&x.i===historyExercise)||unique[0];
 if(!selected){c.innerHTML='<section class="card"><h2>Progresión</h2><p>No hay ejercicios asignados.</p></section>';return;}
 historyDay=selected.d;historyExercise=selected.i;
 const rows=[0,1,2,3].map(w=>{
  const sets=[];
  for(let j=0;j<Math.max(1,Math.min(6,Number(s.plan[selected.d][selected.i].sets)||3));j++){
   const v=s.setLogs?.[key(w,selected.d,selected.i)+':'+j]||{};
   const kg=Number(v.kg), reps=Number(v.reps);
   if(v.kg!==''&&v.kg!=null&&v.reps!==''&&v.reps!=null&&Number.isFinite(kg)&&Number.isFinite(reps)&&kg>=0&&reps>0)sets.push({kg,reps});
  }
  return {w,sets,volume:sets.reduce((a,x)=>a+x.kg*x.reps,0),best:sets.length?Math.max(...sets.map(x=>x.kg)):null};
 });
 const maxVol=Math.max(1,...rows.map(r=>r.volume));
 const recorded=rows.filter(r=>r.sets.length);
 const first=recorded[0],last=recorded[recorded.length-1];
 const change=first&&last&&first!==last&&first.volume>0?(last.volume-first.volume)/first.volume*100:null;
 c.innerHTML=`<section class="card"><span class="eyebrow">SEGUIMIENTO INDIVIDUAL</span><h2>Progresión de cargas</h2><p class="muted">Compará tus registros por ejercicio a lo largo de las cuatro semanas. Volumen = suma de kg × repeticiones de las series registradas.</p><label for="historySelect">Elegir ejercicio</label><select id="historySelect">${unique.map(x=>`<option value="${x.d}:${x.i}" ${x.d===selected.d&&x.i===selected.i?'selected':''}>${esc(days[x.d])} · ${esc(x.name)}</option>`).join('')}</select><div class="history-summary"><div class="history-stat"><small>Mejor carga registrada</small><strong>${recorded.length?Math.max(...recorded.map(x=>x.best))+' kg':'—'}</strong></div><div class="history-stat"><small>Variación de volumen*</small><strong>${change===null?'—':(change>0?'+':'')+change.toFixed(1)+'%'}</strong></div></div><h3>Volumen semanal (kg × reps)</h3><div class="history-bars">${rows.map(r=>`<div class="history-week"><span>Semana ${r.w+1}</span><div class="history-track"><div style="width:${r.volume?Math.max(2,Math.round(100*r.volume/maxVol)):0}%"></div></div><strong>${r.sets.length?r.volume.toLocaleString('es-AR'):'Sin datos'}</strong></div>`).join('')}</div><div class="scroll"><table><thead><tr><th>Semana</th><th>Series registradas</th><th>Mayor carga</th><th>Volumen</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.w+1}</td><td>${r.sets.length}</td><td>${r.best===null?'—':r.best+' kg'}</td><td>${r.sets.length?r.volume.toLocaleString('es-AR'):'—'}</td></tr>`).join('')}</tbody></table></div><p class="muted small">*Comparación entre la primera y última semana con registros, no necesariamente consecutivas. El volumen depende de cuántas series se hayan anotado; no mide por sí solo una mejora de fuerza. Si cambiás el orden de ejercicios de una rutina con registros previos, revisá la correspondencia del historial.</p><button id="historyBack" class="alt">← Volver a mi rutina</button></section>`;
 $('historySelect').onchange=e=>{const [d,i]=e.target.value.split(':').map(Number);historyDay=d;historyExercise=i;renderHistory(s)};
 $('historyBack').onclick=()=>{day=historyDay;view='plan';render()};
}
let historyDay=0,historyExercise=0;
function renderLibrary(){let c=$('content');c.innerHTML=`<section class="card"><h2>Biblioteca de ejercicios</h2><p class="muted">Editá las notas aquí: se actualizarán en la planificación cuando no tengan una nota personalizada.</p><input id="librarySearch" placeholder="Buscar ejercicio o grupo muscular"><div id="libraryRows" class="scroll"></div></section>`;const draw=()=>{let q=$('librarySearch').value.toLowerCase();$('libraryRows').innerHTML=`<table><thead><tr><th>Ejercicio</th><th>Grupo</th><th>Nota técnica editable</th><th>Video</th></tr></thead><tbody>${data.library.map((e,i)=>({e,i})).filter(x=>(x.e.name+' '+x.e.group).toLowerCase().includes(q)).map(({e,i})=>`<tr><td>${esc(e.name)}</td><td>${esc(e.group)}</td><td><textarea rows="2" data-library-note="${i}">${esc(e.note)}</textarea></td><td><a href="${esc(videoUrl(e))}" target="_blank" rel="noopener noreferrer">▶ Ver</a></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-library-note]').forEach(el=>el.onchange=()=>{data.library[+el.dataset.libraryNote].note=el.value;save()})};$('librarySearch').oninput=draw;draw()}
function renderTemplates(student){
 data.templates ||= [];
 const c=$('content');
 c.innerHTML=`<section class="card"><h2>Plantillas de rutinas</h2><p class="muted">Guardá una copia del programa actual para reutilizarlo. Las plantillas no incluyen los registros de entrenamiento ni datos personales del alumno.</p><div class="grid"><div><label>Nombre de la nueva plantilla</label><input id="templateName" maxlength="90" value="${esc(student.planName||'Rutina personalizada')}"></div><div style="align-self:end"><button id="saveTemplate">Guardar programa actual como plantilla</button></div></div><p id="templateFeedback" class="muted" role="status" aria-live="polite"></p></section><section class="card"><h3>Plantillas guardadas (${data.templates.length})</h3>${data.templates.length?`<div class="grid">${data.templates.map((t,i)=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${t.plan.length} días · ${t.weeks} semanas · ${t.plan.reduce((n,d)=>n+d.length,0)} ejercicios</p><div class="toolbar"><button data-apply-template="${i}">Asignar a ${esc(student.name)}</button><button class="alt" data-delete-template="${i}">Eliminar</button></div></div>`).join('')}</div>`:'<p class="muted">Todavía no hay plantillas. Guardá tu planificación actual para comenzar.</p>'}</section>`;
 $('saveTemplate').onclick=()=>{
   const name=$('templateName').value.trim();
   if(!name){$('templateFeedback').textContent='Ingresá un nombre para la plantilla.';return}
   if(!student.plan?.some(d=>d.length)){$('templateFeedback').textContent='Agregá al menos un ejercicio a la planificación antes de guardarla como plantilla.';return}
   data.templates.push({id:'tpl-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name,weeks:planWeeks(student),plan:copy(student.plan)});
   save();render();
 };
 c.querySelectorAll('[data-apply-template]').forEach(b=>b.onclick=()=>{
   const t=data.templates[Number(b.dataset.applyTemplate)];if(!t)return;
   if(!confirm('¿Asignar «'+t.name+'» a '+student.name+'? El plan actual y sus registros se archivarán. La nueva planificación comenzará sin registros.'))return;
   student.planArchive ||= [];
   student.planArchive.push({name:student.planName||'Plan anterior',plan:copy(student.plan),weeks:planWeeks(student),logs:copy(student.logs||{}),setLogs:copy(student.setLogs||{}),done:copy(student.done||{}),archivedAt:new Date().toISOString()});
   student.planName=t.name;student.planWeeks=t.weeks;student.plan=copy(t.plan);student.logs={};student.setLogs={};student.done={};week=0;day=0;
   save();view='plan';render();
   const feedback=document.createElement('div');feedback.className='info';feedback.setAttribute('role','status');feedback.textContent='✓ Plantilla asignada a '+student.name+'. Los registros anteriores están archivados en el respaldo.';$('content').prepend(feedback);
 });
 c.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=()=>{
   const i=Number(b.dataset.deleteTemplate),t=data.templates[i];if(!t)return;
   if(!confirm('¿Eliminar la plantilla «'+t.name+'»? Esto no modifica las rutinas ya asignadas.'))return;
   data.templates.splice(i,1);save();render();
 });
}

function renderStudents(){
 const c=$('content');
 c.innerHTML=`<section class="card"><div class="topline"><div><h2>Fichas de alumnos</h2><p class="muted">Información individual, objetivos y seguimiento. Solo disponible en el modo entrenador de demostración.</p></div></div><div class="grid">${data.students.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p class="muted">${esc(s.goal||'Sin objetivo definido')} · ${Object.values(s.done||{}).filter(Boolean).length}/${totalSessions(s)} sesiones</p><div class="toolbar"><button class="alt" data-profile="${s.id}">Editar ficha</button><button class="alt" data-go="${s.id}">Ver rutina</button></div></div>`).join('')}</div></section>`;
 c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{$('person').value=b.dataset.go;view='plan';render()});
 c.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>openStudentProfile(Number(b.dataset.profile)));
}
function openStudentProfile(id){
 const s=data.students.find(x=>x.id===id);if(!s)return;
 const completed=Object.values(s.done||{}).filter(Boolean).length;
 const total=totalSessions(s);
 const registered=Object.values(s.logs||{}).filter(v=>v&&typeof v==='object'&&Object.values(v).some(x=>x!==''&&x!==null&&x!==undefined)).length;
 showCoachDialog(`<div class="topline"><div><h2>Ficha individual</h2><p class="muted">${esc(s.name)} · ${completed}/${total} sesiones completadas · ${registered} registros</p></div><button class="alt" type="button" id="closeProfile">Cerrar</button></div>
 <form id="studentProfileForm" class="profile-form">
 <div class="grid"><div><label>Nombre y apellido</label><input name="name" required maxlength="120" value="${esc(s.name)}"></div><div><label>Edad</label><input name="age" type="number" min="1" max="120" value="${esc(s.age)}"></div><div><label>Objetivo principal</label><input name="goal" maxlength="200" value="${esc(s.goal)}"></div><div><label>Fecha de inicio</label><input name="joinedAt" type="date" value="${esc(s.joinedAt||'')}"></div></div>
 <div><label>Lesiones, molestias o limitaciones informadas</label><textarea name="limitations" rows="2" maxlength="1500">${esc(s.limitations)}</textarea></div>
 <div><label>Notas privadas del entrenador</label><textarea name="coachNotes" rows="3" maxlength="3000" placeholder="Observaciones de seguimiento, ajustes y prioridades">${esc(s.coachNotes||'')}</textarea></div>
 <div class="toolbar"><button type="button" id="saveStudentProfile">Guardar ficha</button><button type="button" class="alt" id="profileRoutine">Abrir rutina</button></div><p id="profileStatus" class="muted" role="status"></p></form>`);
 const form=document.getElementById('studentProfileForm');
 document.getElementById('closeProfile').onclick=()=>document.getElementById('coachDialog')?.remove();
 document.getElementById('profileRoutine').onclick=()=>{document.getElementById('coachDialog')?.remove();$('person').value=String(id);view='plan';render()};
 const saveProfile=()=>{
  const status=document.getElementById('profileStatus');
  const field=n=>form.elements.namedItem(n)?.value??'';
  const name=String(field('name')).trim();
  if(!name){status.textContent='Ingresá el nombre y apellido.';form.elements.namedItem('name')?.focus();return;}
  const age=String(field('age')).trim();
  if(age && (!Number.isInteger(Number(age))||Number(age)<1||Number(age)>120)){
   status.textContent='Ingresá una edad válida entre 1 y 120.';return;
  }
  const changes={name,age,goal:String(field('goal')).trim(),joinedAt:String(field('joinedAt')),limitations:String(field('limitations')).trim(),coachNotes:String(field('coachNotes')).trim()};
  const previous={};for(const k of Object.keys(changes))previous[k]=s[k];
  Object.assign(s,changes);
  try{
   localStorage.setItem(KEY,JSON.stringify(data));
   const stored=JSON.parse(localStorage.getItem(KEY)||'null');
   const found=stored?.students?.find(x=>String(x.id)===String(s.id));
   if(!found||found.name!==name||found.coachNotes!==changes.coachNotes)throw Error('No se pudo verificar el guardado');
  }catch(err){Object.assign(s,previous);status.textContent='No se pudo guardar en este navegador. Exportá un respaldo y verificá el espacio disponible.';return;}
  document.getElementById('coachDialog')?.remove();render();
  const notice=document.createElement('div');notice.className='info';notice.setAttribute('role','status');notice.textContent='✓ Ficha de '+name+' guardada correctamente.';
  document.getElementById('content')?.prepend(notice);
 };
 document.getElementById('saveStudentProfile').addEventListener('click',saveProfile);
 form.addEventListener('submit',ev=>{ev.preventDefault();saveProfile()});
}
function exportData(){let blob=new Blob([JSON.stringify({version:5,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GD_COACH_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importData(ev){let f=ev.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.data?.students||!obj.data?.library)throw Error('Formato inválido');if(!confirm('¿Reemplazar los datos actuales por el respaldo seleccionado?'))return;data=obj.data;for(const student of data.students){if(!Array.isArray(student.plan))student.plan=copy(data.template||SEED.days);student.logs ||= {};student.done ||= {}}save();render()}catch(e){alert('No se pudo importar el respaldo: '+e.message)}}
$('role').onchange=()=>{view='home';render()};$('person').onchange=()=>{week=0;day=0;render()};render();
